[workspace]
members = [".", "pam"]
resolver = "2"

[package]
name = "t3-elevation"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "t3_elevation"
path = "src/lib.rs"

[[bin]]
name = "t3-elevation"
path = "src/bin/t3-elevation.rs"

[[example]]
name = "test-server"
path = "examples/test_server.rs"
required-features = ["fixtures"]

[features]
# Test-only helpers (fake attestation chains). Never enabled in release builds.
fixtures = []

[dependencies]
base64 = "0.22.1"
getrandom = "0.2.17"
libc = "0.2.186"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13.1", features = ["ecdsa", "pkcs8"] }
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
toml = "0.8.23"

[profile.release]
codegen-units = 1
lto = "thin"
# The PAM module wraps every entry point in catch_unwind so a bug returns
# PAM_IGNORE instead of killing sudo; that only works with unwinding.
panic = "unwind"
strip = true
opt-level = "s"
